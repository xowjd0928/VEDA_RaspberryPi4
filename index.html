<!DOCTYPE html>
<html>
<meta charset="UTF-8">
<head>
    <title>
        Raspberry Pi Control
    </title>
</head>

<body>
    <button onclick="fetch('/led_on')">LED ON</button>
    <button onclick="fetch('/led_off')">LED OFF</button>
    <button onclick="fetch('/led_low')">LED LOW</button>
    <button onclick="fetch('/led_medium')">LED MEDIUM</button>
    <button onclick="fetch('/led_high')">LED HIGH</button>

    <hr>
    <input type="number" id="threshold" placeholder="Input Threshold">
    <button onclick="setThreshold()">CDS Start</button>

    <script>
        function setThreshold() {
            const val = document.getElementById('threshold').value;
            if (val === '') {
                alert('Input Threshold Value!');
                return;
            }
            fetch('/cds_start/' + val);
        }
    </script>

    <hr>
    <button onclick="fetch('/buzzer_on')">BUZZER ON</button>
    <button onclick="fetch('/buzzer_off')">BUZZER OFF</button>
</body>

</html>
