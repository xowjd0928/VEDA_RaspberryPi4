<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raspberry Pi Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="main-title">Raspberry Pi Control Panel</div>

        <div class="dashboard-grid">

            <div class="card">
                <div class="card-header">
                    <div class="icon-wrapper icon-led"><i class="fa-regular fa-lightbulb"></i></div>
                    LED Controls
                </div>
                <div class="row-grid">
                    <button class="btn btn-success" id="btn-led-on" onclick="fetch('/led_on')"><i class="fa-solid fa-power-off"></i> LED ON</button>
                    <button class="btn btn-danger" id="btn-led-off" onclick="fetch('/led_off')"><i class="fa-solid fa-power-off"></i> LED OFF</button>
                </div>
                <div class="section-label">Intensity Levels</div>
                <div class="intensity-grid">
                    <button class="btn btn-low" id="btn-led-low" onclick="fetch('/led_low')">LOW</button>
                    <button class="btn btn-med" id="btn-led-med" onclick="fetch('/led_medium')">MED</button>
                    <button class="btn btn-high" id="btn-led-high" onclick="fetch('/led_high')">HIGH</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="icon-wrapper icon-buzzer"><i class="fa-solid fa-volume-high"></i></div>
                    Buzzer Control
                </div>
                <button class="btn btn-success" id="btn-buzzer-on" style="margin-bottom: 16px; width: 100%;" onclick="buzzerOn()">
                    <i class="fa-solid fa-play"></i> BUZZER ON
                </button>
                <button class="btn btn-danger" id="btn-buzzer-off" style="width: 100%;" onclick="buzzerOff()">
                    <i class="fa-solid fa-square"></i> BUZZER OFF
                </button>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="icon-wrapper icon-cds"><i class="fa-solid fa-gear"></i></div>
                    CDS Sensor Threshold
                </div>
                <div class="section-label">Threshold Value (0-1023)</div>
                <div class="input-group">
                    <div class="input-wrapper">
                        <input type="number" class="input-field" id="threshold" placeholder="ex) 120" min="0" max="1023">
                    </div>
                </div>

                <div class="row-grid" style="margin-bottom: 16px;">
                    <button class="btn btn-success" id="btn-cds-submit" onclick="setThreshold()"><i class="fa-solid fa-play"></i> CDS START</button>
                    <button class="btn btn-danger" id="btn-cds-off" onclick="stopCDS()"><i class="fa-solid fa-stop"></i> CDS OFF</button>
                </div>
                <div class="status-bar">
                    <span>Status: <strong id="cds-status" style="color: #64748b;">Inactive</strong></span>
                    <span>Current Reading: <strong id="current-reading">-</strong></span>
                    <span style="text-align: right;">Current Threshold: <strong id="current-threshold">-</strong></span>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="icon-wrapper icon-timer"><i class="fa-solid fa-hourglass-half"></i></div>
                    Countdown Timer
                </div>
                
                <div class="digital-clock" id="web-timer-display">0</div>

                <div class="section-label">Duration (Seconds, 0-9)</div>
                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="fa-regular fa-clock"></i>
                        <input type="number" class="input-field input-with-icon" id="count" placeholder="ex) 5" min="0" max="9">
                    </div>
                    <button class="btn btn-primary" id="btn-timer-submit" onclick="setCount()">Set Timer <i class="fa-solid fa-caret-right"></i></button>
                </div>
            </div>

        </div>
    </div>

    <script>
        let webTimerInterval = null;

        function resetWebTimerState() {
            if (webTimerInterval) {
                clearInterval(webTimerInterval);
                webTimerInterval = null;
            }
            document.getElementById('web-timer-display').innerText = "0";
            document.getElementById('count').value = "";
        }

        function buzzerOn() {
            resetWebTimerState();
            fetch('/buzzer_on');
        }

        function buzzerOff() {
            resetWebTimerState();
            fetch('/buzzer_off');
        }

        function startWebCountdown(startNum) {
            const display = document.getElementById('web-timer-display');
            let currentNum = startNum;

            if (webTimerInterval) clearInterval(webTimerInterval);
            display.innerText = currentNum;

            webTimerInterval = setInterval(() => {
                currentNum--;
                if (currentNum >= 0) {
                    display.innerText = currentNum;
                } else {
                    resetWebTimerState();
                }
            }, 1000);
        }

        function setCount() {
            const val = document.getElementById('count').value;
            if (val === '') {
                alert('Input Count Value!');
                return;
            }

            const num = Number(val);
            if (!Number.isInteger(num) || num < 0 || num > 9) {
                alert('Please enter a number between 0 and 9.');
                return;
            }

            fetch('/segment_start/' + num)
                .then(r => {
                    if(r.ok) {
                        startWebCountdown(num);
                    }
                });
        }

        function setThreshold() {
            const val = document.getElementById('threshold').value;
            if (val === '') {
                alert('Input Threshold Value!');
                return;
            }

            const num = Number(val);
            if (!Number.isInteger(num) || num < 0 || num > 1023) {
                alert('Please enter a number between 0 and 1023.');
                return;
            }
    
            fetch('/cds_start/' + val);
        }

        setInterval(() => {
            fetch('/get_cds_data')
                .then(r => r.text())
                .then(data => {
                    const [reading, threshold] = data.split(',');
                    if (reading === '0' && threshold === '0') {
                        document.getElementById('cds-status').innerText = "Inactive";
                        document.getElementById('cds-status').style.color = "#64748b";
                        document.getElementById('current-reading').textContent = '-';
                        document.getElementById('current-threshold').textContent = '-';
                        return;
                    }
                    document.getElementById('current-reading').textContent = reading;
                    document.getElementById('current-threshold').textContent = threshold;
                    document.getElementById('cds-status').innerText = "Active";
                    document.getElementById('cds-status').style.color = "#52c41a";
                });
        }, 1000);

        function stopCDS() {
            fetch('/cds_off')
                .then(() => {
                    document.getElementById('cds-status').innerText = "Inactive";
                    document.getElementById('cds-status').style.color = "#64748b";
                    document.getElementById('current-threshold').innerText = "-";
                    document.getElementById('current-reading').innerText = "-";
                });
        }
    </script>
</body>
</html>
